<rect x="673" y="534" width="295" height="22" rx="4" fill="#30343b"/>
<rect x="673" y="534" width="108.836" height="22" rx="4" fill="#8754c8"/>
<text x="1064" y="551" text-anchor="end" class="value">25.89</text>
<text x="36" y="625" class="small muted">PSS includes every surviving terminal process, launcher and helper. PTY children and X-server memory are separate.</text>
<text x="36" y="650" class="small muted">Performance: one focused window at a time, nine idle; write → DSR reply. This is logical completion, not display frame rate.</text>
<text x="36" y="675" class="small muted">Memory: fixed UTF-8/color frame, fonts warmed, empty history. 120 × 32 cells, monospace 11 pt; no disk-cache flush.</text>
<text x="36" y="700" class="small muted">ztty 0.2.0 · Ghostty 1.4.0-arch1 · kitty 0.50.0 created by Kovid Goyal · 2026-11-17 UTC</text>
<text x="36" y="725" class="small muted">Raw samples, exact commands, versions, source hashes and scope: docs/benchmarks/terminals-10-windows.json</text>
<text x="36" y="750" class="small muted">Recorded host load1: 31.0–36.6; 24 logical CPUs. Timing samples were collected on a busy host.</text>
</svg>
