name: Native UI acceptance

on:
  push:
    branches: ['validate/native-ui-atomic-20261119']
    paths:
      - '.github/workflows/native-ui-acceptance.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'rust-toolchain.toml'
      - 'src/**'
      - 'crates/**/src/**'
      - 'crates/**/tests/**'
      - 'crates/**/Cargo.toml'
      - 'crates/**/build.rs'
      - 'tests/*.rs'
      - 'tests/native_ui_gui.py'
      - 'tests/input_gui.py'
      - 'tests/repaint_gui.py'
      - 'tests/x11_present_trace.c'
      - 'tools/native_ui_acceptance.py'
      - 'tools/isolated_xvfb.py'
      - 'tools/measure_runtime.py'
      - 'tools/measure_multiwindow.py'
      - 'tools/benchmark_terminals.py'
      - 'examples/native_ui.py'

permissions:
  contents: read

concurrency:
  group: ztty-native-ui-acceptance
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUST_TOOLCHAIN: '1.100.0'
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONOPTIMIZE: '0'
    steps:
      - name: Check out the exact triggering commit
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record immutable source identity and hashes
        id: identity
        run: python3 tools/native_ui_acceptance.py init

      - name: Set up the native test Python
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64

      - name: Install native build and private Xvfb test dependencies
        id: dependencies
        run: |
          exec > >(tee artifacts/native-ui-acceptance/dependencies.log) 2>&1
          export RUSTUP_HOME="$RUNNER_TEMP/ztty-native-ui-rustup"
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxft-dev libxrender-dev pkg-config libfontconfig1-dev libfreetype-dev libharfbuzz-dev libegl1-mesa-dev libgles2-mesa-dev libxtst6 libxres1 \
            xvfb x11-xkb-utils fontconfig fonts-dejavu-core fonts-noto-cjk fonts-noto-color-emoji
          python -m pip install --disable-pip-version-check 'python-xlib==0.33' 'Pillow==13.0.0'
          fc-cache -f
          test "$(uname -m)" = x86_64
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustc +"$RUST_TOOLCHAIN" -Vv
          cargo +"$RUST_TOOLCHAIN" -V
          python -V

      - name: Check formatting
        id: fmt
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: python tools/native_ui_acceptance.py run fmt

      - name: Run strict workspace Clippy
        id: clippy
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: python tools/native_ui_acceptance.py run clippy

      - name: Run all ordinary ztty library tests
        id: lib
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: python tools/native_ui_acceptance.py run lib

      - name: Run 12 action tests
        id: actions
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: python tools/native_ui_acceptance.py run actions

      - name: Run the six real EGL and font tests
        id: gpu
        if: ${{ always() && steps.lib.outcome == 'success' }}
        run: python tools/native_ui_acceptance.py run gpu

      - name: Build and preserve the one release ELF
        id: build
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: python tools/native_ui_acceptance.py run build

      - name: Run 24 native UI checks on that ELF
        id: native_ui
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: python tools/native_ui_acceptance.py run native_ui

      - name: Run 198 input vectors and 14 zoom cases in 14 groups
        id: input
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: python tools/native_ui_acceptance.py run input

      - name: Run 11 repaint and atomic frame checks on that ELF
        id: repaint
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: python tools/native_ui_acceptance.py run repaint

      - name: GPU native UI pixels and interactions
        id: native_ui_gpu
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: python tools/native_ui_acceptance.py run native_ui_gpu

      - name: GPU frame atomicity and interaction fairness
        id: repaint_gpu
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: python tools/native_ui_acceptance.py run repaint_gpu

      - name: Complete text, blink, font parity and renderer reload
        id: text_gpu
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: python tools/native_ui_acceptance.py run text_gpu

      - name: Software retained-frame validity through resize and visibility
        id: retained_frame
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: python tools/native_ui_acceptance.py run retained_frame

      - name: Finalize hashes, gate results, cleanup, and demo image record
        if: ${{ always() }}
        env:
          ACCEPTANCE_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          if [[ -f tools/native_ui_acceptance.py ]]; then
            python3 tools/native_ui_acceptance.py finalize
          else
            mkdir -p artifacts/native-ui-acceptance
            printf '%s\n' '{"ok":false,"error":"checkout did not provide the acceptance runner"}' \
              | tee artifacts/native-ui-acceptance/summary.json
            printf '%s\n' 'ZTTY_NATIVE_ACCEPTANCE_SUMMARY_JSON={"ok":false,"error":"checkout failed"}'
            exit 1
          fi

      - name: Upload complete native evidence, including failed gates
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-ui-linux-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/native-ui-acceptance/
          if-no-files-found: error
          retention-days: 14
