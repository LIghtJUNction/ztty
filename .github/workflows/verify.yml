name: Verify
on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Install X11 and test dependencies
        run: |
          export RUSTUP_HOME="$RUNNER_TEMP/ztty-verify-rustup"
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxft-dev libxrender-dev pkg-config libfontconfig1-dev libfreetype-dev libharfbuzz-dev libegl1-mesa-dev libgles2-mesa-dev libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev fonts-dejavu-core fonts-noto-cjk xvfb python3-pil python3-xlib openssh-server
          rustup target add x86_64-unknown-none
      - name: Check source and GUI
        run: |
          ZTTY_WAYLAND=1 ZTTY_BARE_METAL=1 make check
          cargo test --locked --workspace --doc
          cargo clippy --locked --workspace --all-targets --features wayland -- -D warnings
          /usr/bin/python3 tests/new_windows.py --binary target/release/ztty
          /usr/bin/python3 tests/gui_smoke.py
          /usr/bin/python3 tests/gpu_isolation.py --binary target/release/ztty --output artifacts/gpu-isolation.json
          /usr/bin/python3 tests/ssh_mux.py --binary target/release/ztty --output artifacts/ssh-mux.json
          /usr/bin/python3 tests/ssh_mux_gui.py --binary target/release/ztty --output artifacts/ssh-mux-gui.json --screenshot artifacts/ssh-mux-gui.png
      - name: Upload SSH acceptance diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ztty-verify-ssh-diagnostics-${{ github.run_attempt }}
          path: |
            artifacts/ssh-mux*.json
            artifacts/ssh-mux-gui*.png
          if-no-files-found: warn
