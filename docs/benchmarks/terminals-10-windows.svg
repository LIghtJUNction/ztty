<text x="600" y="387" class="h">Output processing throughput</text>
<text x="600" y="410" class="small muted">MiB/s · higher is better</text>
<text x="600" y="453" class="label">ztty</text>
<rect x="673" y="436" width="295" height="22" rx="4" fill="var(--track)"/>
<rect x="673" y="436" width="23.794" height="22" rx="4" fill="#1a73e8"/>
