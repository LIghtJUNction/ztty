[package]
name = "zterm"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bounded no_std terminal screen, scrollback and VT protocol state"
readme = "README.md"
keywords = ["terminal", "no-std", "vt", "ansi", "screen"]
categories = ["no-std", "command-line-interface", "parsing"]

[dependencies]
ztty-ui = { version = "0.1.0", path = "../ztty-ui" }
zgraphics = { version = "0.2.0", path = "../zgraphics", default-features = false }
zinput = { version = "0.1.3", path = "../zinput", default-features = false }
zvte = { version = "=0.1.3", default-features = false }
unicode-width = { version = "=0.2.3", default-features = false }
