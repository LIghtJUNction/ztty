<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc">
<title id="title">Ten terminal windows: memory and real PTY performance</title>
<desc id="desc">Three fresh-process runs per terminal, all using shared instances. Application PSS excludes the display server; a second panel adds full dedicated Xvfb PSS. Probe workloads and private D-Bus are separate. Latency and throughput use DSR logical completion, not a rendered-frame fence.</desc>
<style>:root{--bg:#fff;--panel:#f8fafd;--ink:#202124;--muted:#5f6368;--line:#dfe3e8;--track:#e9edf3}@media(prefers-color-scheme:dark){:root{--bg:#17191d;--panel:#202329;--ink:#e8eaed;--muted:#bdc1c6;--line:#41464d;--track:#30343b}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:20px;font-weight:600}.small{font-size:13px}.value{font-size:16px;font-weight:600}.label{font-size:15px}</style>
<rect width="1120" height="790" rx="18" fill="var(--bg)"/>
<text x="36" y="47" font-size="28" font-weight="600">10 windows. Shared instances. Same workload.</text>
<text x="36" y="76" class="muted" font-size="15">Linux X11 / isolated Xvfb · software rendering · medians of 3 fresh-process runs</text>
<rect x="36" y="102" width="504" height="229" rx="12" fill="var(--panel)" stroke="var(--line)"/>
<text x="56" y="134" class="h">Application PSS</text>
<text x="56" y="157" class="small muted">MiB resident · lower is better</text>
<text x="56" y="200" class="label">ztty</text>
<rect x="129" y="183" width="295" height="22" rx="4" fill="var(--track)"/>
<rect x="129" y="183" width="5.846" height="22" rx="4" fill="#1a73e8"/>
<text x="520" y="200" text-anchor="end" class="value">15.36</text>
