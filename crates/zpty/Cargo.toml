[package]
name = "zpty"
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
description = "Native no_std PTY and ConPTY ownership for Linux, macOS and Windows"
license = "MIT"
repository = "https://github.com/LIghtJUNction/ztty"
readme = "README.md"
keywords = ["pty", "terminal", "no-std", "linux"]
categories = ["os::unix-apis", "no-std"]
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]

[[example]]
name = "capture"
path = "examples/capture.rs"

[[test]]
name = "darwin_spawn"
path = "tests/darwin_spawn.rs"
harness = false
