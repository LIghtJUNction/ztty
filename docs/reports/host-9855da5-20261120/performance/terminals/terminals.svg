<title id="title">Ten terminal windows: memory and real PTY performance</title>
<desc id="desc">3 fresh-process runs per terminal, all using shared instances. Application PSS excludes the display server; a second panel adds full dedicated Xvfb PSS. Probe workloads and private D-Bus are separate. Latency and throughput use DSR logical completion, not a rendered-frame fence.</desc>
