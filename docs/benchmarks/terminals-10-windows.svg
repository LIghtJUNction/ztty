<rect x="36" y="355" width="504" height="229" rx="12" fill="var(--panel)" stroke="var(--line)"/>
<text x="56" y="387" class="h">PTY round-trip latency (p50)</text>
<text x="56" y="410" class="small muted">µs · lower is better</text>
<text x="56" y="453" class="label">ztty</text>
<rect x="129" y="436" width="295" height="22" rx="4" fill="var(--track)"/>
<rect x="129" y="436" width="1.624" height="22" rx="4" fill="#1a73e8"/>
