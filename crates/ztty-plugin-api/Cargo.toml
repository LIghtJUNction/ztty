[package]
name = "ztty-plugin-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Versioned no_std text action interface for ztty extensions"
authors.workspace = true
readme = "README.md"
keywords = ["terminal", "plugin", "no-std"]
categories = ["no-std", "api-bindings"]
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[dependencies]
zplugin = { git = "https://github.com/LIghtJUNction/zplugin.git", default-features = false, features = ["macros"] }
