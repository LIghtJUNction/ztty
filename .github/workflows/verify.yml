name: Verify
on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install X11 and test dependencies
        run: |
          export RUSTUP_HOME="$RUNNER_TEMP/ztty-verify-rustup"
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxft-dev libxrender-dev pkg-config libfontconfig1-dev libfreetype-dev libharfbuzz-dev libegl1-mesa-dev libgles2-mesa-dev fonts-dejavu-core xvfb python3-pil python3-xlib
          rustup target add x86_64-unknown-none
      - name: Check source and GUI
        run: |
          ZTTY_BARE_METAL=1 make check
          cargo test --locked --workspace --doc
          /usr/bin/python3 tests/gui_smoke.py
