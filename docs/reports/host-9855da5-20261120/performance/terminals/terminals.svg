<text x="36" y="625" class="small muted">App PSS counts all terminal processes. The second panel includes the full dedicated 7680×2160 Xvfb baseline.</text>
<text x="36" y="650" class="small muted">PTY probes and private D-Bus are separate. PSS covers resident pages only; this is not total GPU/VRAM accounting.</text>
<text x="36" y="675" class="small muted">One active window, nine idle; write → DSR reply. Logical completion, not frame rate. Memory: fixed frame + 1s settle.</text>
<text x="36" y="700" class="small muted">Max sampled Swap (app + X server counters): ztty 0.00 MiB · Ghostty 0.00 MiB · Kitty 0.00 MiB</text>
<text x="36" y="725" class="small muted">ztty 0.5.0 · Ghostty 1.4.0+omarchy.1 · kitty 0.50.0 created by Kovid Goyal · 2026-11-20 UTC · 120×32 cells · monospace 11 pt</text>
<text x="36" y="750" class="small muted">Raw samples, versions, hashes and scope: artifacts/final-performance-9855da5-20261120/terminals/terminals.json</text>
<text x="36" y="775" class="small muted">Recorded host load1: 4.6–8.9; 24 logical CPUs.</text>
