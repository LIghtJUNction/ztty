<text x="600" y="551" class="label">Kitty</text>
<rect x="673" y="534" width="295" height="22" rx="4" fill="var(--track)"/>
<rect x="673" y="534" width="108.836" height="22" rx="4" fill="#8754c8"/>
<text x="1064" y="551" text-anchor="end" class="value">25.89</text>
<text x="36" y="625" class="small muted">App PSS counts all terminal processes. The second panel includes the full dedicated 7680×2160 Xvfb baseline.</text>
<text x="36" y="650" class="small muted">PTY probes and private D-Bus are separate. PSS covers resident pages only; this is not total GPU/VRAM accounting.</text>
<text x="36" y="675" class="small muted">One active window, nine idle; write → DSR reply. Logical completion, not frame rate. Memory: fixed frame + 1s settle.</text>
<text x="36" y="700" class="small muted">Max sampled Swap (app + X server counters): ztty 0.04 MiB · Ghostty 93.45 MiB · Kitty 29.08 MiB</text>
<text x="36" y="725" class="small muted">ztty 0.2.0 · Ghostty 1.4.0-arch1 · kitty 0.50.0 created by Kovid Goyal · 2026-11-17 UTC · 120×32 cells · monospace 11 pt</text>
<text x="36" y="750" class="small muted">Raw samples, versions, hashes and scope: docs/benchmarks/terminals-10-windows.json</text>
</svg>
