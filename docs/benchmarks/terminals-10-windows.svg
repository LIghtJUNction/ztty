<rect x="129" y="232" width="295" height="22" rx="4" fill="var(--track)"/>
<rect x="129" y="232" width="295.000" height="22" rx="4" fill="#00897b"/>
<text x="520" y="249" text-anchor="end" class="value">775.4</text>
<text x="56" y="298" class="label">Kitty</text>
<rect x="129" y="281" width="295" height="22" rx="4" fill="var(--track)"/>
<rect x="129" y="281" width="133.605" height="22" rx="4" fill="#8754c8"/>
<text x="520" y="298" text-anchor="end" class="value">351.2</text>
<rect x="580" y="102" width="504" height="229" rx="12" fill="var(--panel)" stroke="var(--line)"/>
<text x="600" y="134" class="h">App + full X server PSS</text>
<text x="600" y="157" class="small muted">MiB resident · lower is better</text>
<text x="600" y="200" class="label">ztty</text>
<rect x="673" y="183" width="295" height="22" rx="4" fill="var(--track)"/>
<rect x="673" y="183" width="46.561" height="22" rx="4" fill="#1a73e8"/>
<text x="1064" y="200" text-anchor="end" class="value">137.8</text>
<text x="600" y="249" class="label">Ghostty</text>
<rect x="673" y="232" width="295" height="22" rx="4" fill="var(--track)"/>
<rect x="673" y="232" width="295.000" height="22" rx="4" fill="#00897b"/>
<text x="1064" y="249" text-anchor="end" class="value">873.1</text>
<text x="600" y="298" class="label">Kitty</text>
<rect x="673" y="281" width="295" height="22" rx="4" fill="var(--track)"/>
