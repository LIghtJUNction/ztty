name: termlens CLI PTY
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: termlens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-pty:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install native build dependencies and pinned Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxft-dev libxrender-dev pkg-config libfontconfig1-dev libfreetype-dev libharfbuzz-dev libegl1-mesa-dev libgles2-mesa-dev
          export RUSTUP_HOME="$RUNNER_TEMP/ztty-termlens-rustup"
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Build real ztty and check isolated harness
        run: |
          cargo build --locked --release --bin ztty
          cargo fmt --manifest-path tests/termlens/Cargo.toml -- --check
          cargo clippy --locked --manifest-path tests/termlens/Cargo.toml --all-targets -- -D warnings
      - name: Assert CLI behavior through real PTYs
        run: timeout 60s cargo test --locked --manifest-path tests/termlens/Cargo.toml -- --test-threads=1
        env:
          ZTTY_BINARY: ${{ github.workspace }}/target/release/ztty
          TERMLENS_ARTIFACT_DIR: ${{ runner.temp }}/termlens
      - name: Upload failing wait diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: termlens-cli-${{ github.run_attempt }}
          path: ${{ runner.temp }}/termlens
          if-no-files-found: ignore
          retention-days: 7
