[workspace]
members = ["crates/zinput", "crates/zpty", "crates/zterm", "crates/zgraphics"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
authors = ["LIghtJUNction"]
repository = "https://github.com/LIghtJUNction/ztty"

[package]
name = "ztty"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A lean native no_std Rust terminal with Kitty graphics, built on Project Z"
readme = "README.md"
categories = ["command-line-utilities", "no-std"]
keywords = ["terminal", "linux", "no-std", "x11", "pty"]

[[bin]]
name = "ztty"
path = "src/main.rs"
test = false
bench = false

[[test]]
name = "session_core"
path = "tests/session_core.rs"
harness = false

[dependencies]
zterm = { path = "crates/zterm", version = "0.2.1", default-features = false }
zpty = { path = "crates/zpty", version = "0.2.0", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.bench]
lto = "fat"
codegen-units = 1
