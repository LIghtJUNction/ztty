<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc">
<title id="title">Ten terminal windows: memory and real PTY performance</title>
<desc id="desc">3 fresh-process runs per terminal, all using shared instances. Application PSS and private memory exclude probe workloads and the X server. Latency and throughput use DSR logical completion, not a rendered-frame fence.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#e8eaed}.muted{fill:#bdc1c6}.h{font-size:20px;font-weight:600}.small{font-size:13px}.value{font-size:16px;font-weight:600}.label{font-size:15px}</style>
<rect width="1120" height="790" rx="18" fill="#17191d"/>
<text x="36" y="47" font-size="28" font-weight="600">10 windows. Shared instances. Same workload.</text>
<text x="36" y="76" class="muted" font-size="15">Linux X11 / isolated Xvfb · software rendering · medians of 3 fresh-process runs</text>
<rect x="36" y="102" width="504" height="229" rx="12" fill="#202329" stroke="#41464d"/>
